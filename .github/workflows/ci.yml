name: OrzAudioCore

on: [push, pull_request]

jobs:
  abi-lite:
    strategy:
      matrix: {os: [macos-15, ubuntu-24.04]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node script/check-release-readiness.mjs
      - run: node script/generate-decoder-manifest.mjs --check
      - run: node --test script/lib/manifest.test.mjs
      - run: cmake --preset builtin-lite
      - run: cmake --build --preset builtin-lite
      - run: ctest --test-dir .cmake-build/builtin-lite --output-on-failure
      - run: swift test
      - run: cmake --install .cmake-build/builtin-lite --prefix "$RUNNER_TEMP/orzcore"
      - run: cmake -S Tests/SDK/consumer -B "$RUNNER_TEMP/consumer" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/orzcore"
      - run: cmake --build "$RUNNER_TEMP/consumer"
      - run: "$RUNNER_TEMP/consumer/consumer"

  windows-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node script/check-release-readiness.mjs
      - run: cmake -S . -B build -DORZ_PROFILE=builtin-lite -DORZ_BUILD_TESTS=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows lite artifact
        shell: bash
        run: ./script/package-sdk.sh builtin-lite "$GITHUB_WORKSPACE/ci-release"
      - name: Lite conformance on Windows
        shell: bash
        run: |
          node script/fetch-conformance-fixtures.mjs --format ym,mid,bp
          node script/run-conformance.mjs --binary .cmake-build/builtin-lite/Release/orz_conformance.exe \
            --out conformance --platform windows-x86_64-lite --formats ym,mid,bp
      - uses: actions/upload-artifact@v4
        with:
          name: windows-lite
          path: |
            ci-release/*.tar.gz
            ci-release/*.sha256
            conformance/

  windows-full:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            git make autoconf automake libtool patch tar gzip curl
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-zlib pkgconf
      - name: Fetch locked decoder sources
        run: ./script/fetch-decoder-sources.sh
      - name: Build full decoder archives
        env:
          CC: gcc
          CXX: g++
          AR: ar
          RANLIB: ranlib
          ORZ_HOST_TRIPLE: x86_64-w64-mingw32
          CMAKE_GENERATOR: MinGW Makefiles
          CMAKE_PREFIX_PATH: /mingw64
          JOBS: "4"
        run: ./script/build-native-libs.sh --strict
      - name: Package Windows full SDK
        env:
          CMAKE_GENERATOR: MinGW Makefiles
          CMAKE_PREFIX_PATH: /mingw64
          SOURCE_DATE_EPOCH: "0"
        run: ./script/package-sdk.sh windows-x86_64-full win-release
      - name: Full conformance on Windows
        run: |
          export PATH="$PWD/.cmake-build/windows-x86_64-full:$PATH"
          node script/fetch-conformance-fixtures.mjs
          node script/run-conformance.mjs --binary .cmake-build/windows-x86_64-full/orz_conformance.exe \
            --out conformance --platform windows-x86_64 --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-full
          path: |
            win-release/*.tar.gz
            win-release/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-windows-full
          path: conformance/

  conformance-lite:
    strategy:
      matrix:
        include:
          - {os: macos-15, platform: macos-arm64-lite}
          - {os: ubuntu-24.04, platform: linux-x86_64-lite}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cmake --preset builtin-lite
      - run: cmake --build --preset builtin-lite
      - run: node script/fetch-conformance-fixtures.mjs --format ym,mid,bp
      - run: >-
          node script/run-conformance.mjs
          --binary .cmake-build/builtin-lite/orz_conformance
          --out conformance --platform ${{ matrix.platform }}
          --formats ym,mid,bp
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-lite-${{ matrix.platform }}
          path: conformance/

  conformance-compare:
    needs: conformance-lite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: conformance-lite-*, path: conformance, merge-multiple: true}
      - run: node script/compare-conformance.mjs conformance/macos-arm64-lite conformance/linux-x86_64-lite

  conformance-compare-full:
    needs: [full-macos, windows-full]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "conformance-*", path: conformance, merge-multiple: true}
      - run: node script/compare-conformance.mjs conformance/macos-arm64 conformance/windows-x86_64 --allow-pcm-drift --sample-tolerance 0.001

  sanitizer-lite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B .cmake-build/sanitizer-lite
          -DORZ_PROFILE=builtin-lite -DORZ_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build .cmake-build/sanitizer-lite
      - run: ctest --test-dir .cmake-build/sanitizer-lite --output-on-failure

  full-macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/cache@v4
        with:
          path: .wasm-build/cache
          key: orz-decoder-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/fetch-decoder-sources.sh') }}
      - run: ./script/fetch-decoder-sources.sh
      - run: ./script/build-native-libs.sh --strict
      - id: host
        run: echo "preset=macos-$(uname -m)" >> "$GITHUB_OUTPUT"
      - run: ./script/build-sdk.sh "${{ steps.host.outputs.preset }}"
      - run: cmake --install ".cmake-build/${{ steps.host.outputs.preset }}" --prefix "$RUNNER_TEMP/orzcore"
      - run: cmake -S Tests/SDK/consumer -B "$RUNNER_TEMP/consumer" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/orzcore"
      - run: cmake --build "$RUNNER_TEMP/consumer"
      - run: DYLD_LIBRARY_PATH="$RUNNER_TEMP/orzcore/lib" "$RUNNER_TEMP/consumer/consumer"
      - run: node script/fetch-conformance-fixtures.mjs
      - run: >-
          node script/run-conformance.mjs
          --binary .cmake-build/${{ steps.host.outputs.preset }}/orz_conformance
          --out conformance --platform macos-arm64 --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-full-macos
          path: conformance/

  web-binding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node script/check-release-readiness.mjs
      - working-directory: SDK/Web
        run: npm ci
      - working-directory: SDK/Web
        run: npm run build
      - working-directory: SDK/Web
        run: npm test
