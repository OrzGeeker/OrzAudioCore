name: Release OrzAudioCore

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify tag and manifest version
        run: node script/check-release-readiness.mjs "${GITHUB_REF_NAME#v}"
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./script/package-sdk.sh builtin-lite "$RUNNER_TEMP/release"
      - run: node script/fetch-conformance-fixtures.mjs --format ym,mid,bp
      - run: >-
          node script/run-conformance.mjs
          --binary .cmake-build/builtin-lite/orz_conformance
          --out "$RUNNER_TEMP/conformance"
          --platform linux-x86_64-lite --formats ym,mid,bp
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-native
          path: ${{ runner.temp }}/conformance/

  server:
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04, preset: linux-x86_64, arch: x86_64}
          - {runner: ubuntu-24.04-arm, preset: linux-arm64, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/cache@v4
        with:
          path: .wasm-build/cache
          key: orz-decoder-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/fetch-decoder-sources.sh') }}
      - name: Verify tag and manifest version
        run: node script/check-release-readiness.mjs "${GITHUB_REF_NAME#v}"
      - run: ./script/fetch-decoder-sources.sh
      - run: ./script/build-native-libs.sh --strict
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./script/package-sdk.sh "${{ matrix.preset }}" "$RUNNER_TEMP/release"
      - run: ./script/verify-elf-exports.sh ".cmake-build/${{ matrix.preset }}/libOrzAudioCore.so"
      - run: node script/fetch-conformance-fixtures.mjs
      - run: >-
          node script/run-conformance.mjs
          --binary .cmake-build/${{ matrix.preset }}/orz_conformance
          --out "$RUNNER_TEMP/conformance"
          --platform linux-${{ matrix.arch }} --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-server-${{ matrix.arch }}
          path: ${{ runner.temp }}/conformance/

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, registry-url: "https://registry.npmjs.org"}
      - run: node script/check-release-readiness.mjs "${GITHUB_REF_NAME#v}"
      - uses: mymindstorm/setup-emsdk@v14
        with: {version: "4.0.10"}
      - uses: actions/cache@v4
        with:
          path: .wasm-build/cache
          key: orz-wasm-full-${{ runner.os }}-${{ hashFiles('script/fetch-decoder-sources.sh', 'script/build-wasm.sh') }}
      - run: ./script/fetch-decoder-sources.sh
      - run: ORZ_WASM_OUTPUT_DIR="$GITHUB_WORKSPACE/SDK/Web/wasm" ./script/build-wasm.sh
      - run: ./script/build-wasm-lite.sh
      - working-directory: SDK/Web
        run: npm install && npm run build && npm test
      - run: node script/verify-web-release.mjs
      - run: ./script/package-web-sdk.sh "$RUNNER_TEMP/release"
      - run: node script/fetch-conformance-fixtures.mjs
      - run: >-
          node script/run-conformance-web.mjs
          --module SDK/Web/wasm/orz_audio.mjs
          --wasm SDK/Web/wasm/orz_audio.wasm
          --out "$RUNNER_TEMP/conformance" --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-web
          path: ${{ runner.temp }}/conformance/

  apple:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/cache@v4
        with:
          path: .wasm-build/cache
          key: orz-decoder-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/fetch-decoder-sources.sh') }}
      - run: node script/check-release-readiness.mjs "${GITHUB_REF_NAME#v}"
      - run: ./script/fetch-decoder-sources.sh
      - run: ./script/build-native-libs.sh --strict
      - id: host
        run: echo "preset=macos-$(uname -m)" >> "$GITHUB_OUTPUT"
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./script/package-sdk.sh "${{ steps.host.outputs.preset }}" "$RUNNER_TEMP/release"
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./script/package-apple-sdk.sh "$RUNNER_TEMP/release" --profile full
      - run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./script/package-apple-sdk.sh "$RUNNER_TEMP/release" --profile builtin-lite
      - run: ./script/smoke-apple.sh "$RUNNER_TEMP/release/OrzAudioCore-${GITHUB_REF_NAME#v}-apple-full/OrzAudioCore.xcframework"
      - run: node script/fetch-conformance-fixtures.mjs
      - run: >-
          node script/run-conformance.mjs
          --binary .cmake-build/${{ steps.host.outputs.preset }}/orz_conformance
          --out "$RUNNER_TEMP/conformance" --platform macos-arm64 --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.swift
            ${{ runner.temp }}/release/*.swift.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-apple
          path: ${{ runner.temp }}/conformance/

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27b
          link-to-sdk: true
      - name: Verify tag and manifest version
        run: node script/check-release-readiness.mjs "${GITHUB_REF_NAME#v}"
      - uses: actions/cache@v4
        with:
          path: .wasm-build/cache
          key: orz-decoder-sources-${{ runner.os }}-${{ hashFiles('script/fetch-decoder-sources.sh') }}
      - run: ./script/fetch-decoder-sources.sh
      - name: Build C SDK + official AAR (all ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          JOBS: "4"
          ORZ_RELEASE_DIR: ${{ runner.temp }}/release
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./script/build-android-aar.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/*.aar
            ${{ runner.temp }}/release/*.aar.sha256

  windows-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Package Windows lite SDK
        shell: bash
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" ./script/package-sdk.sh builtin-lite "$RUNNER_TEMP/release"
      - name: Lite conformance on Windows
        shell: bash
        run: |
          node script/fetch-conformance-fixtures.mjs --format ym,mid,bp
          node script/run-conformance.mjs --binary .cmake-build/builtin-lite/Release/orz_conformance.exe             --out "$RUNNER_TEMP/conformance" --platform windows-x86_64-lite --formats ym,mid,bp
      - uses: actions/upload-artifact@v4
        with:
          name: windows-lite
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-windows-lite
          path: ${{ runner.temp }}/conformance/

  windows-full:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            git make autoconf automake libtool patch tar gzip curl
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-zlib pkgconf
      - run: ./script/fetch-decoder-sources.sh
      - name: Build full decoder archives
        env:
          CC: gcc
          CXX: g++
          AR: ar
          RANLIB: ranlib
          ORZ_HOST_TRIPLE: x86_64-w64-mingw32
          CMAKE_GENERATOR: MinGW Makefiles
          CMAKE_PREFIX_PATH: /mingw64
          JOBS: "4"
        run: ./script/build-native-libs.sh --strict
      - name: Package Windows full SDK
        env:
          CMAKE_GENERATOR: MinGW Makefiles
          CMAKE_PREFIX_PATH: /mingw64
          SOURCE_DATE_EPOCH: "0"
        run: ./script/package-sdk.sh windows-x86_64-full win-release
      - name: Full conformance on Windows
        run: |
          export PATH="$PWD/.cmake-build/windows-x86_64-full:$PATH"
          node script/fetch-conformance-fixtures.mjs
          node script/run-conformance.mjs --binary .cmake-build/windows-x86_64-full/orz_conformance.exe \
            --out conformance --platform windows-x86_64 --require-all
      - uses: actions/upload-artifact@v4
        with:
          name: windows-full
          path: |
            win-release/*.tar.gz
            win-release/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-windows-full
          path: conformance/

  conformance-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27b
          link-to-sdk: true
      - uses: actions/cache@v4
        with:
          path: .wasm-build/cache
          key: orz-decoder-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('script/fetch-decoder-sources.sh') }}
      - run: ./script/fetch-decoder-sources.sh
      - name: Build x86_64 conformance probe
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          JOBS: "4"
        run: ./script/build-android-conformance.sh
      - run: node script/fetch-conformance-fixtures.mjs
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          script: ./script/run-conformance-android.sh --out conformance/android-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-android
          path: conformance/

  conformance-compare:
    needs: [native, windows-lite, windows-full, server, apple, web, conformance-android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "conformance-*", path: conformance, merge-multiple: true}
      - run: node script/compare-conformance.mjs conformance/macos-arm64 conformance/linux-x86_64 --allow-pcm-drift --sample-tolerance 0.001
      - run: node script/compare-conformance.mjs conformance/linux-x86_64-lite conformance/windows-x86_64-lite --allow-pcm-drift
      - run: node script/compare-conformance.mjs conformance/linux-x86_64 conformance/windows-x86_64 --allow-pcm-drift
      - run: node script/compare-conformance.mjs conformance/linux-x86_64 conformance/web --allow-pcm-drift
      - run: node script/compare-conformance.mjs conformance/linux-x86_64 conformance/android-x86_64 --allow-pcm-drift

  publish:
    needs: [native, windows-lite, windows-full, server, web, apple, android, conformance-compare]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: release, merge-multiple: true}
      - name: Verify every asset and generate a lockfile
        run: node script/check-release-readiness.mjs "${GITHUB_REF_NAME#v}" --release-dir release
      - name: Bundle conformance reports
        run: |
          mapfile -t dirs < <(find release -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/index.json' \; -print | xargs -r -n1 basename)
          tar -czf "release/conformance-${GITHUB_REF_NAME#v}.tar.gz" -C release "${dirs[@]}"
          shasum -a 256 "release/conformance-${GITHUB_REF_NAME#v}.tar.gz" > "release/conformance-${GITHUB_REF_NAME#v}.tar.gz.sha256"
      - name: Publish release candidate
        if: contains(github.ref_name, '-')
        run: |
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes --verify-tag
        env: {GH_TOKEN: "${{ github.token }}"}
      - name: Publish stable release
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mapfile -d '' assets < <(find release -maxdepth 1 -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag --latest
        env: {GH_TOKEN: "${{ github.token }}"}
